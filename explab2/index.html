<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>NYC's Subway Passanger Flows - Fridays of April, 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <style>
  body { margin: 0; }
  #map { position: absolute; inset: 0; }
  /* styling for the slider and its bar, css temlpate from my EL1 legend. */
    #time-control { 
    position: absolute;
    bottom: 30px;
    left: 30px;
    z-index: 1;
    background: #34405E;
    color: #FFFFFF;
    padding: 15px;
    border-radius: 8px;
    font: 13px sans-serif;
  }
    #hour-slider {
      display: block;
      width: 250px;
      margin-top: 12px;
}
    #o-d-controls {
/* learned how to style checkboxes from https://www.w3schools.com/css/css3_flexbox.asp */
      display: flex;
      gap: 20px;
      margin-top: 15px;
    }
</style>
</head>
<body>
  <div id="map"></div>
  <!-- making the time slider. learned how to make range slider in html/css from https://www.w3schools.com/howto/howto_js_rangeslider.asp   -->
  <div id="time-control">
    <label for="hour-slider">Hour: <span id="hour-label">7:00 AM</span></label>
    <input type="range" id="hour-slider" min="0" max="23" value="7" step="1">
    <!-- type range is a slider, were doing 24 hours of data from midnight to 11pm, so thats 0-23 hrs. 
    initial value is 7 which is arbitrary, and we only have hourly data so the step is 1.  -->
    <div id="o-d-controls">
      <label>
        <input type="checkbox" id="show-origins" checked>
        Origins
      </label>
      <label>
        <input type="checkbox" id="show-destinations">
        Destinations
      </label>
      <label>
        <input type="checkbox" id="show-balance" checked>
        Flow Balance
      </label>
    </div>
      
  </div>

  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: 'nyc_subway_style.json',
      center: [-73.95, 40.72],
      zoom: 10
    });
     map.on('load', function (){
      // this is to initialize the map at 7am to match the label
    map.setFilter('origin-destination', ['==', ['get', 'Hour of Day'], 7]);
    // link paint properties to the number of origins from a stop at a given hour. setPaintProperty template taken from ubc trees assignemnt. 
       map.setPaintProperty('origin-destination', 'circle-radius', 
                            ['interpolate', ['linear'], ['get', 'sum_estimated_average_ridership'],
                             0, 2,
                             100, 4,
                             500, 7,
                             1000, 10,
                             5000, 18]);
       // i just did the one layer in maputnik but im now realizing i need a second layer for destinations and a third for net arrivals. 
       // syntax from https://maplibre.org/maplibre-gl-js/docs/API/classes/Map/#addlayer
       map.addLayer({
          id: 'destinations',
          type: 'circle',
          source: 'MTA_OD_EL2',
         filter: ['==', ['get', 'Hour of Day'], 7],
         layout: {visibility:'none'},
         paint: {
           'circle-radius': ['interpolate', ['linear'], 
           ['get', 'destinations'],
           0, 2,
           100, 4,
           500, 7,
           1000, 10,
           5000, 18],
          'circle-color': '#F0A15B', 
           'circle-opacity': .7}});
       //because the raw counts of origins and destinations can get hectic, im adding a third layer which is 
       //colored by the PROPORTION of riders departing or arriving from a station. it will scale with magnitude. 
       //so flow balance = (destinations-origins)/(destinations+origins). 1 means all arrivals, -1 means all departures
        //division by zero would throw errors. i was quite stumped here, so I did use AI for this one part. 
        //It was just a single question, and im only using the template claude returned. it prompted me to make some variables and
       //use a case expression to check if denom is non zero, in which case it allows the division to happen. very clever.
       const total = [ '+', ['get', 'destinations'],
                      ['get', 'sum_estimated_average_ridership']];
       const balance = ['case', ['==', total, 0], 0,
                        ['/', ['get', 'net_arrivals'], total]];
                             
       map.addLayer({
          id: 'flow-balance',
          type: 'circle',
          source: 'MTA_OD_EL2',
         filter: ['==', ['get', 'Hour of Day'], 7],
         layout: {visibility:'none'},
         paint: {
           'circle-radius': ['interpolate', ['linear'], 
           total,
           0, 2,
           100, 4,
           500, 7,
           1000, 10,
           5000, 18],
          'circle-color': '#bac2cd',
           'circle-opacity': .7}});
       
    // connect hour html/css elements with JS
       const slider = document.getElementById('hour-slider');
       const slider_label = document.getElementById('hour-label');
    // connect origin and destination checkboxes
       const origins_checkbox = document.getElementById('show-origins');
       const destinations_checkbox = document.getElementById('show-destinations');
       const balance_checkbox = document.getElementById('show-balance');
       function updateVisibility(){
        if (balance_checkbox.checked){
          //for when balance mode is on
          map.setLayoutProperty('flow-balance', 'visibility', 'visible');
          map.setLayoutProperty('origin-destination', 'visibility', 'none');
          map.setLayoutProperty('destinations', 'visibility', 'none');
          //we also want the other two boxes to be unusable when this is on. 
          origins_checkbox.disabled = true;
          destinations_checkbox.disabled = true;}
        else {//when the balance box is unchecked
          //origin/destination mode
          map.setLayoutProperty('flow-balance', 'visibility', 'none');
          //ensure the following checboxes are online 
          origins_checkbox.disabled = false;
          destinations_checkbox.disabled = false;
          //now we just have to display the right layers when the checkboxes are on a certain way
          // instead of visible or none, make the visibility dependent on 
          if (origins_checkbox.checked){
            map.setLayoutProperty('origin-destination', 'visibility', 'visible');}
          else {
            map.setLayoutProperty('origin-destination', 'visibility', 'none');}
          if (destinations_checkbox.checked){
            map.setLayoutProperty('destinations', 'visibility', 'visible');}
          else {
            map.setLayoutProperty('destinations', 'visibility', 'none');}}}
    // to make the slider interactve i used the previously linked website and also just google search to figure out what syntax is right for me
    slider.addEventListener('input', function() {
      const hour = Number(slider.value); 
      // the value of the slider will come out as a string, so i used the number function to force it to switch to the right data type
      map.setFilter('origin-destination', ['==', ['get', 'Hour of Day'], hour]);
      // even when the destinations layer is invisible i still want it to update alongside arrivals
      map.setFilter('destinations', ['==', ['get', 'Hour of Day'], hour]);
      map.setFilter('flow-balance', ['==', ['get', 'Hour of Day'], hour]);
      //visibiity behaviour is very particular. i want users to be able to see origins, destinations as one, the other, or both
      // but i want the flow-balance to only be seeon its own, ie when it is triggered the other two need to turn off. 
      //compsci 103 taught me about helper functions conceptually so ill make one. this one is pretty intuitive
      

      let displayHour 
      //regular, non-military humans dont read time as 0, 1, 2, etc. so im creating a variable to dispaly time nicely. 
      //rather 12:00 AM. there are 2 cases where we'll have 12:00 so we need to diferentiate. using === as a strict match to double verify the Number function prev
      //for pm (13, 14, etc) we need to subtract 12 to get 1, 2, etc.
      if (hour === 0){
        displayHour = '12:00 AM'}
      else if (hour < 12){
        displayHour = hour + ':00 AM'}
      else if (hour === 12){
        displayHour = '12:00 PM'}
      else{
        displayHour = (hour - 12) + ':00 PM'}

      //set label to displayHour, using textContent from my last activity (ubc trees expanded)
      slider_label.textContent = displayHour;
    }); // close the slider event listener
       //need to make the data appear or disappear when the checkboxes are clicked. google says the listener for checkboxes is 'change'
       //using setLayoutProperty which i learned in the ubc trees expansion and lab 1. 
       origins_checkbox.addEventListener('change', function(){
         updateVisibility()
       })
       destinations_checkbox.addEventListener('change', function(){
         updateVisibility()

       })
        balance_checkbox.addEventListener('change', function(){
          updateVisibility()
        })
        updateVisibility()
    }); // close map.on
   
  </script>
</body>
</html>
